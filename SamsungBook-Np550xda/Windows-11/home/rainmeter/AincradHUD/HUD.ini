[Rainmeter]
Update=1000
DynamicWindowSize=1
OnTopStyle=OnTop

[Metadata]
Name=Aincrad HUD
Author=SAO Theme
Information=System status HUD inspired by the Sword Art Online menu.
Version=1.1.0

[Variables]
cyan=90,220,255,255
cyanDim=90,220,255,140
cyanFaint=90,220,255,60
alert=255,90,90,230
alertFont=255,120,120,255
panelBG=4,10,18,175
textDim=170,225,245,190
fontName=Consolas
W=300
H=296

; ----------------------------------
; MEASURES
; ----------------------------------
[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeasureDate]
Measure=Time
Format=%A, %d de %B

[MeasureCPU]
Measure=CPU
Processor=0
IfAboveValue=75
IfAboveAction=[!SetOption MeterHPBar BarColor "#alert#"][!SetOption MeterHPPercent FontColor "#alertFont#"][!Redraw]
IfBelowValue=74
IfBelowAction=[!SetOption MeterHPBar BarColor "#cyan#"][!SetOption MeterHPPercent FontColor "#cyan#"][!Redraw]

[MeasureRAM]
Measure=PhysicalMemory
UpdateDivider=10

[MeasureRAMPercent]
Measure=PhysicalMemory
Percentual=1
UpdateDivider=10
IfAboveValue=80
IfAboveAction=[!SetOption MeterMPBar BarColor "#alert#"][!SetOption MeterMPPercent FontColor "#alertFont#"][!Redraw]
IfBelowValue=79
IfBelowAction=[!SetOption MeterMPBar BarColor "#cyan#"][!SetOption MeterMPPercent FontColor "#cyan#"][!Redraw]

[MeasureDiskFreePercent]
Measure=FreeDiskSpace
Drive=C:
Percentual=1
UpdateDivider=30
IfBelowValue=15
IfBelowAction=[!SetOption MeterDiskBar BarColor "#alert#"][!SetOption MeterDiskPercent FontColor "#alertFont#"][!Redraw]
IfAboveValue=16
IfAboveAction=[!SetOption MeterDiskBar BarColor "#cyan#"][!SetOption MeterDiskPercent FontColor "#cyan#"][!Redraw]

[MeasureNetIn]
Measure=NetIn
UpdateDivider=2

[MeasureNetOut]
Measure=NetOut
UpdateDivider=2

; ----------------------------------
; PANEL BACKGROUND + FRAME
; ----------------------------------
[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,#W#,#H#,6 | Fill Color #panelBG# | StrokeWidth 1 | Stroke Color #cyanFaint#
X=0
Y=0

[MeterBracketTL_H]
Meter=Shape
Shape=Line 0,0,26,0 | StrokeWidth 2 | Stroke Color #cyan#
X=6
Y=6

[MeterBracketTL_V]
Meter=Shape
Shape=Line 0,0,0,26 | StrokeWidth 2 | Stroke Color #cyan#
X=6
Y=6

[MeterBracketTR_H]
Meter=Shape
Shape=Line 0,0,-26,0 | StrokeWidth 2 | Stroke Color #cyan#
X=(#W#-6)
Y=6

[MeterBracketTR_V]
Meter=Shape
Shape=Line 0,0,0,26 | StrokeWidth 2 | Stroke Color #cyan#
X=(#W#-6)
Y=6

[MeterBracketBL_H]
Meter=Shape
Shape=Line 0,0,26,0 | StrokeWidth 2 | Stroke Color #cyan#
X=6
Y=(#H#-6)

[MeterBracketBL_V]
Meter=Shape
Shape=Line 0,0,0,-26 | StrokeWidth 2 | Stroke Color #cyan#
X=6
Y=(#H#-6)

[MeterBracketBR_H]
Meter=Shape
Shape=Line 0,0,-26,0 | StrokeWidth 2 | Stroke Color #cyan#
X=(#W#-6)
Y=(#H#-6)

[MeterBracketBR_V]
Meter=Shape
Shape=Line 0,0,0,-26 | StrokeWidth 2 | Stroke Color #cyan#
X=(#W#-6)
Y=(#H#-6)

; ----------------------------------
; HEADER
; ----------------------------------
[MeterTitle]
Meter=String
Text="S W O R D   A R T   O N L I N E"
FontFace=#fontName#
FontSize=8
FontColor=#cyan#
StringStyle=Bold
AntiAlias=1
X=20
Y=16

[MeterSubtitle]
Meter=String
Text="SYSTEM MENU // FLOOR 01"
FontFace=#fontName#
FontSize=7
FontColor=#cyanDim#
AntiAlias=1
X=20
Y=32

[MeterDividerHeader]
Meter=Shape
Shape=Line 0,0,(#W#-40),0 | StrokeWidth 1 | Stroke Color #cyanFaint#
X=20
Y=50

; ----------------------------------
; CLOCK
; ----------------------------------
[MeterClock]
Meter=String
MeasureName=MeasureTime
FontFace=#fontName#
FontSize=26
FontColor=#cyan#
StringStyle=Bold
AntiAlias=1
X=20
Y=58

[MeterDate]
Meter=String
MeasureName=MeasureDate
FontFace=#fontName#
FontSize=8
FontColor=#textDim#
AntiAlias=1
X=20
Y=98

[MeterDividerMid]
Meter=Shape
Shape=Line 0,0,(#W#-40),0 | StrokeWidth 1 | Stroke Color #cyanFaint#
X=20
Y=120

; ----------------------------------
; SYSTEM HP (CPU load)
; ----------------------------------
[MeterHPLabel]
Meter=String
Text="HP // CPU LOAD"
FontFace=#fontName#
FontSize=7
FontColor=#textDim#
AntiAlias=1
X=20
Y=132

[MeterHPPercent]
Meter=String
MeasureName=MeasureCPU
Percentual=1
Text="%1%"
FontFace=#fontName#
FontSize=7
FontColor=#cyan#
StringAlign=Right
AntiAlias=1
X=((#W#-20))
Y=132

[MeterHPBarBG]
Meter=Shape
Shape=Rectangle 0,0,(#W#-40),8 | Fill Color 20,30,40,220 | StrokeWidth 1 | Stroke Color #cyanFaint#
X=20
Y=146

[MeterHPBar]
Meter=Bar
MeasureName=MeasureCPU
BarColor=#cyan#
BarOrientation=Horizontal
X=20
Y=146
W=((#W#-40))
H=8

; ----------------------------------
; SYSTEM MP (free memory)
; ----------------------------------
[MeterMPLabel]
Meter=String
Text="MP // MEMORY"
FontFace=#fontName#
FontSize=7
FontColor=#textDim#
AntiAlias=1
X=20
Y=164

[MeterMPPercent]
Meter=String
MeasureName=MeasureRAM
Percentual=1
Text="%1%"
FontFace=#fontName#
FontSize=7
FontColor=#cyan#
StringAlign=Right
AntiAlias=1
X=((#W#-20))
Y=164

[MeterMPBarBG]
Meter=Shape
Shape=Rectangle 0,0,(#W#-40),8 | Fill Color 20,30,40,220 | StrokeWidth 1 | Stroke Color #cyanFaint#
X=20
Y=178

[MeterMPBar]
Meter=Bar
MeasureName=MeasureRAM
BarColor=#cyan#
BarOrientation=Horizontal
X=20
Y=178
W=((#W#-40))
H=8

; ----------------------------------
; STORAGE (disk C free space)
; ----------------------------------
[MeterDiskLabel]
Meter=String
Text="INV // DISK C: FREE"
FontFace=#fontName#
FontSize=7
FontColor=#textDim#
AntiAlias=1
X=20
Y=196

[MeterDiskPercent]
Meter=String
MeasureName=MeasureDiskFreePercent
Text="%1%"
FontFace=#fontName#
FontSize=7
FontColor=#cyan#
StringAlign=Right
AntiAlias=1
X=((#W#-20))
Y=196

[MeterDiskBarBG]
Meter=Shape
Shape=Rectangle 0,0,(#W#-40),8 | Fill Color 20,30,40,220 | StrokeWidth 1 | Stroke Color #cyanFaint#
X=20
Y=210

[MeterDiskBar]
Meter=Bar
MeasureName=MeasureDiskFreePercent
BarColor=#cyan#
BarOrientation=Horizontal
X=20
Y=210
W=((#W#-40))
H=8

[MeterDividerLow]
Meter=Shape
Shape=Line 0,0,(#W#-40),0 | StrokeWidth 1 | Stroke Color #cyanFaint#
X=20
Y=232

; ----------------------------------
; NETWORK THROUGHPUT (replaces the old feed-dependent RSS panel)
; ----------------------------------
[MeterNetLabel]
Meter=String
Text="UPLINK / DOWNLINK"
FontFace=#fontName#
FontSize=7
FontColor=#textDim#
AntiAlias=1
X=20
Y=244

[MeterNetOut]
Meter=String
MeasureName=MeasureNetOut
AutoScale=1
NumOfDecimals=1
Text="▲ %1B/s"
FontFace=#fontName#
FontSize=7
FontColor=#cyan#
AntiAlias=1
X=20
Y=258

[MeterNetIn]
Meter=String
MeasureName=MeasureNetIn
AutoScale=1
NumOfDecimals=1
Text="▼ %1B/s"
FontFace=#fontName#
FontSize=7
FontColor=#cyan#
StringAlign=Right
AntiAlias=1
X=((#W#-20))
Y=258

; ----------------------------------
; FOOTER
; ----------------------------------
[MeterStatusDot]
Meter=Shape
Shape=Ellipse 0,0,3,3 | Fill Color 120,255,180,255
X=22
Y=(#H#-28)

[MeterStatus]
Meter=String
Text="LINK STATUS: ONLINE"
FontFace=#fontName#
FontSize=7
FontColor=#textDim#
AntiAlias=1
X=32
Y=(#H#-32)
