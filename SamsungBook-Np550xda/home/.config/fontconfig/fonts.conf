<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Lexend</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Lexend</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Lexend</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Lexend</string>
    </edit>
  </match>

  <!-- Piso de acessibilidade: nenhuma fonte renderiza abaixo de 18pt, mesmo
       que o app peça um tamanho menor. Não afeta terminais, que definem o
       tamanho fora do fontconfig (ver fonts/README.md). -->
  <match target="font">
    <test name="size" compare="less">
      <double>18</double>
    </test>
    <edit name="size" mode="assign">
      <double>18</double>
    </edit>
  </match>
</fontconfig>
