name: omarchy-stack

services:
  postgres:
    image: postgres:17-alpine
    container_name: omarchy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omarchy-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frankmd:
    image: akitaonrails/frankmd:1.0.1
    container_name: omarchy-frankmd
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${FRANKMD_SECRET_KEY_BASE}
      FRANKMD_AUTH_TOKEN: ${FRANKMD_AUTH_TOKEN}
    volumes:
      - ${FRANKMD_NOTES_DIR}:/rails/notes
    ports:
      - "127.0.0.1:7591:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 5s
      retries: 5

  ai-memory:
    image: docker.io/akitaonrails/ai-memory:2.3.0
    container_name: omarchy-ai-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:49374:49374"
    volumes:
      - ai-memory-data:/data
    environment:
      AI_MEMORY_LLM_PROVIDER: ${AI_MEMORY_LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MEMORY_EMBEDDING_PROVIDER: ${AI_MEMORY_EMBEDDING_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  pihole:
    image: pihole/pihole:2026.07.2
    container_name: omarchy-pihole
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
    volumes:
      - pihole-etc:/etc/pihole
    # Bound only to 127.0.0.1: this laptop uses Pi-hole as its DNS, but it
    # is not exposed to the rest of the local network (user's choice).
    ports:
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
      - "127.0.0.1:8080:80"
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "dig", "+short", "@127.0.0.1", "pi.hole"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  ai-memory-data:
  pihole-etc:
