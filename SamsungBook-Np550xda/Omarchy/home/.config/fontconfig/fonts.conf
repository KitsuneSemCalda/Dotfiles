<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Lexend</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Lexend</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Lexend</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Lexend</string>
    </edit>
  </match>

  <!-- Accessibility floor: no font renders below 20pt, even if the app
       requests a smaller size. Does not affect terminals, which set their
       size outside of fontconfig (see fonts/README.md). -->
  <match target="font">
    <test name="size" compare="less">
      <double>20</double>
    </test>
    <edit name="size" mode="assign">
      <double>20</double>
    </edit>
  </match>
</fontconfig>
