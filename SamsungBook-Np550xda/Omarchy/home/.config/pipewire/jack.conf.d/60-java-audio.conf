# Minecraft's bundled OpenAL selects JACK. Keep Java client audio threads out
# of realtime scheduling; server PipeWire/RTKit policy remains unchanged.
context.properties.rules = [
    { matches = [ { application.process.binary = "java" } ]
      actions = { update-props = { loop.rt-prio = 0 } }
    }
]
jack.rules = [
    { matches = [ { application.process.binary = "java" } ]
      actions = { update-props = { rt.prio = 0 } }
    }
]
